<title>Watch 101 NFL — SHELL v0</title>
<!--
  ============================================================================
  ⚠️ SIGNPOST FOR FUTURE WALTER (added 2026-05-13 late evening)
  ============================================================================
  THERE ARE TWO NFL index.html FILES. BOTH ARE LIVE. BOTH HAVE A PURPOSE.
  DO NOT TREAT THEM AS DUPLICATES. DO NOT MERGE THEM.

  THIS FILE — `Fantasy Football/Cloudflare Deploy/index.html`
    Purpose : NFL site SHELL / landing page (the home/hub page)
    URL     : root of the NFL section on fantasywatch101.com
    Title   : "Watch 101 NFL — SHELL v0"
    Has     : brand shell, header, navigation
    Does NOT have : the watch-list table, the star Priority column,
                    Sleeper player search, or any of the watch-list code

  THE OTHER FILE — `Fantasy Football/Cloudflare Deploy/watch-list/index.html`
    Purpose : the actual NFL watch list (table of players Matt is tracking)
    URL     : /watch-list/ on fantasywatch101.com's NFL section
    Title   : "Watch 101 NFL — Watch List"
    Has     : star-rating Priority column, Sleeper search, sortable headers,
              watch-list save/load, the sortable column headers Matt uses

  HOW TO PICK THE RIGHT ONE WHEN THE DUDE ASKS FOR A FOOTBALL EDIT:
    - "the football landing page" / "NFL home page" / "the NFL shell"
        → THIS file (the one you're reading now)
    - "the football watch list" / "the priority stars" / "the player table"
      / "the sortable column" / "Matt's NFL list" / "the Sleeper search"
        → THE OTHER file (`watch-list/index.html`)
    - When in doubt, ASK the Dude before grepping or editing.

  Companion signpost lives in the other file's header for symmetry.
  ============================================================================

  Watch 101 NFL — index.html — SHELL_V0 (2026-05-13 early-morning)
  ----------------------------------------------------------------------------
  First front-end shell for the NFL site. Visual-only clone of baseball's
  brand surface (Bowlby One + Nunito Sans fonts, dark surface palette, header
  layout) with the NFL color overrides applied (green + brown instead of
  red/blue, plus a turf-green accent on the wordmark).

  What this file does TODAY:
    - Renders the Watch 101 NFL header with the football logo
    - Connects to the live NFL backend at https://nfl-nas.fantasywatch101.com
    - Shows "Season state" widget — pulls from /sleeper/state
    - Shows "Trending Adds" widget — top 10 NFL adds from /sleeper/trending
    - Has a "Refresh" button + "Last updated" timestamp

  What this file does NOT do yet (Phase 1 scope notes):
    - No Yahoo OAuth (no league-aware data)
    - No Watch List rows (no list-data endpoints exist server-side yet)
    - No Pool / Leaders / Prospects tabs
    - No Matt's curated picks (Integrity list isn't built yet)
    - No Save-to-Excel
    - No filters dropdown
    - No Deep Cut overlay
    - No Day Mode toggle (yet — easy port from baseball when needed)
    - No mobile-tighten CSS overrides (yet — easy port)

  Architectural decisions:
    - SERVER_URL points at the NFL Cloudflare Tunnel hostname directly.
      Same pattern as baseball — one variable controls the read endpoint.
    - Trending Adds shows player_id only for now. Once /sleeper/players is
      cached on the NFL server, we'll cross-reference IDs to names. Tonight
      the goal is just "the page loads and shows real numbers from the
      server." Names land in the next pass.
    - Sport color tokens swap baseball red/blue for NFL turf green / pigskin
      brown. Matt's locked color call (5/11): green + brown, field-themed.
  ============================================================================
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700;800;900&family=Bowlby+One&display=swap');
*{box-sizing:border-box;margin:0;padding:0}

/* ── COLOR TOKENS ──────────────────────────────────────────────────────────
   Same surface palette as baseball (so the dark UI feels identical), but
   the sport-colored tokens are NFL-themed:
     --turf      = field green (the wordmark accent)
     --pigskin   = football brown
     --turf-deep = darker green for hover/border
*/
:root{
  --bg:#080c10;--surface:#0d1117;--surface2:#131920;--surface3:#1a2330;
  --border:#1e2d3d;--border2:#253545;
  --gold:#f0a500;--gold2:#c47f00;
  --blue:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f97316;
  --turquoise:#06b6d4;--turquoise2:#0891b2;
  --text:#ffffff;--text2:#e2e8f0;--text3:#94a3b8;
  /* NFL sport tokens (replaces baseball's --title-blue / --title-red) */
  --turf:#16a34a;            /* field green — for "Watch" in the wordmark */
  --turf-deep:#15803d;       /* darker green — borders, hovers */
  --pigskin:#92400e;         /* football brown — for "101" in the wordmark */
  --pigskin-light:#b45309;   /* lighter brown for accents */
  --header-grad-1:#080c10;--header-grad-2:#0d1520;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Nunito Sans',sans-serif;
  font-size:14px;
  font-weight:700;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── HEADER ───────────────────────────────────────────────────────────────
   Mirrors baseball's header EXACTLY in structure — same .header,
   .logo-wrap, .logo, .logo-img, .logo-sub class names so the file feels
   like the same product family. Only the color CLASSES differ:
     - .logo-watch   → green (matches "Watch" in baseball's red, but NFL green)
     - .logo-football → brown (where baseball used .logo-baseball blue)
*/
.header{
  background:linear-gradient(135deg,var(--header-grad-1) 0%,var(--header-grad-2) 50%,var(--header-grad-1) 100%);
  border-bottom:1px solid var(--turf-deep);
  padding:1.25rem 1.5rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:100;
}
.logo-wrap{display:flex;align-items:baseline;gap:12px}
.logo{
  font-family:'Bowlby One',sans-serif;
  font-size:64px;
  letter-spacing:0.08em;
  line-height:1;
  display:flex;
  align-items:center;
  gap:0.05em;
}
.logo-img{height:1.8em;width:auto;display:block;flex-shrink:0}
.logo .logo-watch{color:var(--turf)}
.logo .logo-football{color:var(--pigskin-light)}
.logo-sub{
  font-family:'Nunito Sans',sans-serif;
  font-size:10px;
  letter-spacing:0.2em;
  color:var(--turf);
  text-transform:uppercase;
}
.header-right{display:flex;align-items:center;gap:14px}
.last-updated{
  font-family:'Nunito Sans',sans-serif;
  font-size:11px;
  color:var(--turf);
}


/* MULTISPORT_BANNERS_V1 (NFL page, 2026-05-13) — small sport mini-logos
   in the header that let the user navigate to other sports. Mirrors the
   pattern used on the baseball site. On THIS page we show baseball + NBA
   (we don't show NFL on the NFL page — the wordmark already says NFL). */
.logo-mini{font-family:'Bowlby One',sans-serif;font-size:26px;letter-spacing:0.04em;line-height:1;display:flex;align-items:center;gap:0.1em;opacity:0.9;cursor:default;}
a.logo-mini{cursor:pointer;text-decoration:none;}
a.logo-mini:hover{opacity:1;}
.logo-mini .logo-mini-img{height:1.6em;width:auto;display:block;flex-shrink:0;}
.logo-mini .logo-mini-sport{font-weight:800;letter-spacing:0.06em;}
.logo-mini.mlb .logo-mini-sport{color:#dc2626;} /* baseball red */
.logo-mini.nba .logo-mini-sport{color:#ea580c;} /* basketball orange */

/* ── BUTTONS ────────────────────────────────────────────────────────────── */
.btn{
  padding:7px 14px;
  border-radius:6px;
  font-size:12px;
  font-family:'Nunito Sans',sans-serif;
  cursor:pointer;
  border:1px solid;
  transition:all 0.15s;
  letter-spacing:0.05em;
}
.btn-gold{background:var(--gold);color:#000;border-color:var(--gold);font-weight:500}
.btn-gold:hover{background:#fbbf24;border-color:#fbbf24}
.btn-outline{background:transparent;color:var(--text2);border-color:var(--border2)}
.btn-outline:hover{background:var(--surface2);color:var(--text);border-color:var(--text3)}

/* ── BODY LAYOUT ──────────────────────────────────────────────────────────
   Two side-by-side cards on desktop: Season State + Trending Adds.
   Stacks vertically on mobile via flex-wrap.
*/
.body-wrap{
  padding:1.5rem;
  display:flex;
  flex-wrap:wrap;
  gap:1.5rem;
  align-items:flex-start;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:1.25rem;
  flex:1;
  min-width:300px;
}
.card h2{
  font-family:'Nunito Sans',sans-serif;
  font-size:14px;
  font-weight:800;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--turf);
  margin-bottom:0.75rem;
  border-bottom:1px solid var(--border2);
  padding-bottom:0.5rem;
}
.kv{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  font-size:13px;
  border-bottom:1px solid var(--border);
}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;font-size:11px}
.kv .v{color:var(--text);font-weight:700}

/* ── TRENDING TABLE ──────────────────────────────────────────────────────── */
table.trending{width:100%;border-collapse:collapse;font-size:13px}
table.trending thead th{
  text-align:left;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.1em;
  color:var(--text3);
  font-weight:700;
  padding:6px 4px;
  border-bottom:1px solid var(--border2);
}
table.trending tbody td{
  padding:8px 4px;
  border-bottom:1px solid var(--border);
}
table.trending tbody tr:hover{background:var(--surface2)}
table.trending tbody td.rk{color:var(--text3);font-weight:800;width:30px}
table.trending tbody td.name{color:var(--text);font-weight:800}
table.trending tbody td.team{color:var(--text3);font-weight:600;font-size:12px;letter-spacing:0.05em}
table.trending tbody td.age{color:var(--text3);font-size:12px;text-align:right;width:40px}
table.trending tbody td.cnt{text-align:right;color:var(--turf);font-weight:800;width:80px}

/* POS_BADGE_V1 (May 13, 2026) — small color-coded position chip.
   Football positions: QB blue, RB green, WR orange, TE purple, DEF gray. */
.pos-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:0.08em;margin-right:8px;font-family:'Nunito Sans',sans-serif;min-width:30px;text-align:center}
.pos-QB{background:rgba(59,130,246,0.18);color:#60a5fa;border:1px solid #1e3a8a}
.pos-RB{background:rgba(34,197,94,0.18);color:#4ade80;border:1px solid #166534}
.pos-WR{background:rgba(249,115,22,0.18);color:#fb923c;border:1px solid #9a3412}
.pos-TE{background:rgba(168,85,247,0.18);color:#c084fc;border:1px solid #6b21a8}
.pos-DEF{background:rgba(148,163,184,0.18);color:#cbd5e1;border:1px solid #475569}
.pos-K{background:rgba(245,158,11,0.18);color:#fbbf24;border:1px solid #92400e}
.pos-other{background:var(--surface2);color:var(--text3);border:1px solid var(--border2)}

/* ── STATUS BAR ─────────────────────────────────────────────────────────── */
.status-bar{
  font-size:11px;
  color:var(--text3);
  margin-top:0.75rem;
  font-style:italic;
}
.status-bar.error{color:var(--red);font-weight:700;font-style:normal}
.status-bar.ok{color:var(--turf)}

/* ── FOOTER ─────────────────────────────────────────────────────────────── */
.footer{
  text-align:center;
  padding:2rem 1rem;
  color:var(--text3);
  font-size:11px;
  border-top:1px solid var(--border);
  margin-top:2rem;
}
.footer a{color:var(--turf);text-decoration:none}
.footer a:hover{text-decoration:underline}
</style>
</head>
<body>

<!-- ── HEADER ────────────────────────────────────────────────────────────── -->
<div class="header">
  <div class="logo-wrap">
    <div class="logo">
      <span class="logo-watch">Watch</span><img class="logo-img" src="../images/watch101_football_logo.png" alt="Watch 101 NFL"><span class="logo-football">NFL</span>
    </div>
    <div class="logo-sub">Dashboard · Trending & State</div>
  </div>
  <div class="header-right">
    <a class="logo-mini mlb" href="../../" title="Watch 101 MLB — open the baseball site"><img class="logo-mini-img" src="../images/watch101_baseball_logo.png" alt="101"><span class="logo-mini-sport">MLB</span></a><a class="logo-mini nba" href="https://fantasywatch101.com/nba/watch-list/" title="Watch101 NBA — open the basketball site"><img class="logo-mini-img" src="../images/watch101_basketball_logo.png" alt="101"><span class="logo-mini-sport">NBA</span></a>
    <span id="last-updated" class="last-updated">Loading…</span>
    <a class="btn btn-outline" href="../" style="text-decoration:none;display:inline-block">← Watch List</a>
    <button class="btn btn-outline" onclick="loadAll()">Refresh</button>
  </div>
</div>

<!-- ── BODY ──────────────────────────────────────────────────────────────── -->
<div class="body-wrap">

  <!-- Season State card -->
  <div class="card" style="max-width:380px">
    <h2>Season State</h2>
    <div id="season-state-body">Loading season state…</div>
    <div id="season-state-status" class="status-bar"></div>
  </div>

  <!-- Trending Adds card -->
  <div class="card">
    <h2>Trending Adds (Last 24 Hours)</h2>
    <table class="trending">
      <thead>
        <tr><th>Rk</th><th>Player</th><th>Team</th><th style="text-align:right">Age</th><th style="text-align:right">Adds</th></tr>
      </thead>
      <tbody id="trending-body">
        <tr><td colspan="5" style="color:var(--text3);padding:1rem 0">Loading trending adds…</td></tr>
      </tbody>
    </table>
    <div id="trending-status" class="status-bar"></div>
  </div>

</div>

<!-- ── FOOTER ────────────────────────────────────────────────────────────── -->
<div class="footer">
  Watch 101 NFL — SHELL v0 (2026-05-13). Powered by
  <a href="https://docs.sleeper.app" target="_blank" rel="noopener">Sleeper API</a>.
  Backend: <span id="backend-url" style="font-family:monospace"></span>
</div>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
// Single source of truth for the NFL backend. Same pattern as baseball.
const SERVER_URL = 'https://nfl-nas.fantasywatch101.com';

// Stamp the backend URL into the footer so the user can see it at a glance.
document.getElementById('backend-url').textContent = SERVER_URL;

// ── Helpers ──────────────────────────────────────────────────────────────────
function fmtSeasonType(t){
  switch(t){
    case 'off':     return 'Offseason';
    case 'pre':     return 'Preseason';
    case 'regular': return 'Regular Season';
    case 'post':    return 'Postseason';
    default:        return t || '—';
  }
}
function fmtNumber(n){
  if(n == null || n === '') return '—';
  return Number(n).toLocaleString();
}
function nowStamp(){
  const d = new Date();
  const pad = (x) => String(x).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// ── /sleeper/state ───────────────────────────────────────────────────────────
async function loadSeasonState(){
  const bodyEl   = document.getElementById('season-state-body');
  const statusEl = document.getElementById('season-state-status');
  statusEl.textContent = 'Fetching from server…';
  statusEl.className = 'status-bar';
  try{
    const res = await fetch(`${SERVER_URL}/sleeper/state`);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    bodyEl.innerHTML = `
      <div class="kv"><span class="k">Season</span><span class="v">${data.season || '—'}</span></div>
      <div class="kv"><span class="k">Type</span><span class="v">${fmtSeasonType(data.season_type)}</span></div>
      <div class="kv"><span class="k">Week</span><span class="v">${data.week ?? '—'}</span></div>
      <div class="kv"><span class="k">Display Week</span><span class="v">${data.display_week ?? '—'}</span></div>
      <div class="kv"><span class="k">Previous Season</span><span class="v">${data.previous_season || '—'}</span></div>
      <div class="kv"><span class="k">Season Has Scores</span><span class="v">${data.season_has_scores ? 'Yes' : 'No'}</span></div>
      <div class="kv"><span class="k">Season Start Date</span><span class="v">${data.season_start_date || 'TBD'}</span></div>
    `;
    statusEl.textContent = `OK — fetched ${nowStamp()}`;
    statusEl.className = 'status-bar ok';
    return true;
  }catch(e){
    bodyEl.innerHTML = '<div style="color:var(--text3);padding:1rem 0">Could not load season state.</div>';
    statusEl.textContent = `Error: ${e.message}`;
    statusEl.className = 'status-bar error';
    return false;
  }
}

// ── /sleeper/players (full DB cache) ─────────────────────────────────────────
// Fetched once per page load; ~5MB; held in memory for the session.
// Subsequent refreshes re-use this cache so we don't re-pay the 5MB cost
// on every Refresh button click.
let _playerDB = null;
let _playerDBPromise = null;

async function loadPlayers(){
  if(_playerDB) return _playerDB;
  if(_playerDBPromise) return _playerDBPromise;  // already in-flight, share

  _playerDBPromise = (async () => {
    const res = await fetch(`${SERVER_URL}/sleeper/players`);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    _playerDB = data;
    return data;
  })();

  return _playerDBPromise;
}

// Map a Sleeper player record to the cell content we want to show.
// Returns { name, team, pos, age } — strings, with '—' for missing fields.
function _summarizePlayer(p){
  if(!p) return {name:'(unknown)', team:'—', pos:'?', age:'—'};
  // Defenses come back as full team objects — first_name/last_name aren't there.
  // For team defenses Sleeper sets position='DEF' and full_name = "Team Defense".
  const name = p.full_name || ((p.first_name||'') + ' ' + (p.last_name||'')).trim() || '(unnamed)';
  return {
    name,
    team: p.team || '—',
    pos:  p.position || '?',
    age:  (p.age != null) ? String(p.age) : '—'
  };
}

// Position class for the badge — falls back to "other" for anything unexpected.
function _posClass(pos){
  if(!pos) return 'pos-other';
  const known = ['QB','RB','WR','TE','DEF','K'];
  return known.includes(pos) ? `pos-${pos}` : 'pos-other';
}

// ── /sleeper/trending ────────────────────────────────────────────────────────
async function loadTrending(){
  const bodyEl   = document.getElementById('trending-body');
  const statusEl = document.getElementById('trending-status');
  statusEl.textContent = 'Fetching trending list + player DB…';
  statusEl.className = 'status-bar';
  try{
    // Fetch trending and player DB in parallel — both can run concurrently.
    const [trendRes, players] = await Promise.all([
      fetch(`${SERVER_URL}/sleeper/trending?limit=10&hours=24`),
      loadPlayers()
    ]);
    if(!trendRes.ok) throw new Error(`HTTP ${trendRes.status}`);
    const data = await trendRes.json();

    const rows = (data.trending || []).map((t,i) => {
      const p = players[t.player_id];
      const s = _summarizePlayer(p);
      const posBadge = `<span class="pos-badge ${_posClass(s.pos)}">${s.pos}</span>`;
      return `
        <tr>
          <td class="rk">${i+1}</td>
          <td class="name">${posBadge}${s.name}</td>
          <td class="team">${s.team}</td>
          <td class="age">${s.age}</td>
          <td class="cnt">${fmtNumber(t.count)}</td>
        </tr>
      `;
    }).join('');
    bodyEl.innerHTML = rows || '<tr><td colspan="5" style="color:var(--text3);padding:1rem 0">No trending data.</td></tr>';
    const dbSize = Object.keys(players).length;
    statusEl.textContent = `OK — ${data.trending?.length || 0} players from trending, ${dbSize.toLocaleString()} players in DB, fetched ${nowStamp()}`;
    statusEl.className = 'status-bar ok';
    return true;
  }catch(e){
    bodyEl.innerHTML = '<tr><td colspan="5" style="color:var(--text3);padding:1rem 0">Could not load trending adds.</td></tr>';
    statusEl.textContent = `Error: ${e.message}`;
    statusEl.className = 'status-bar error';
    return false;
  }
}

// ── Refresh All ──────────────────────────────────────────────────────────────
async function loadAll(){
  document.getElementById('last-updated').textContent = 'Refreshing…';
  const [stateOk, trendOk] = await Promise.all([loadSeasonState(), loadTrending()]);
  const stamp = nowStamp();
  if(stateOk && trendOk){
    document.getElementById('last-updated').textContent = `Updated ${stamp}`;
  }else{
    document.getElementById('last-updated').textContent = `Partial update ${stamp} — see status below`;
  }
}

// ── Boot ─────────────────────────────────────────────────────────────────────
loadAll();
</script>

</body>
</html>
