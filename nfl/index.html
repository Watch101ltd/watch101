<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch 101 NFL — SHELL v0</title>
<!--
  ============================================================================
  Watch 101 NFL — index.html — SHELL_V0 (2026-05-13 early-morning)
  ----------------------------------------------------------------------------
  First front-end shell for the NFL site. Visual-only clone of baseball's
  brand surface (Bowlby One + Nunito Sans fonts, dark surface palette, header
  layout) with the NFL color overrides applied (green + brown instead of
  red/blue, plus a turf-green accent on the wordmark).

  What this file does TODAY:
    - Renders the Watch 101 NFL header with the football logo
    - Connects to the live NFL backend at https://nfl-nas.fantasywatch101.com
    - Shows "Season state" widget — pulls from /sleeper/state
    - Shows "Trending Adds" widget — top 10 NFL adds from /sleeper/trending
    - Has a "Refresh" button + "Last updated" timestamp

  What this file does NOT do yet (Phase 1 scope notes):
    - No Yahoo OAuth (no league-aware data)
    - No Watch List rows (no list-data endpoints exist server-side yet)
    - No Pool / Leaders / Prospects tabs
    - No Matt's curated picks (Integrity list isn't built yet)
    - No Save-to-Excel
    - No filters dropdown
    - No Deep Cut overlay
    - No Day Mode toggle (yet — easy port from baseball when needed)
    - No mobile-tighten CSS overrides (yet — easy port)

  Architectural decisions:
    - SERVER_URL points at the NFL Cloudflare Tunnel hostname directly.
      Same pattern as baseball — one variable controls the read endpoint.
    - Trending Adds shows player_id only for now. Once /sleeper/players is
      cached on the NFL server, we'll cross-reference IDs to names. Tonight
      the goal is just "the page loads and shows real numbers from the
      server." Names land in the next pass.
    - Sport color tokens swap baseball red/blue for NFL turf green / pigskin
      brown. Matt's locked color call (5/11): green + brown, field-themed.
  ============================================================================
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700;800;900&family=Bowlby+One&display=swap');
*{box-sizing:border-box;margin:0;padding:0}

/* ── COLOR TOKENS ──────────────────────────────────────────────────────────
   Same surface palette as baseball (so the dark UI feels identical), but
   the sport-colored tokens are NFL-themed:
     --turf      = field green (the wordmark accent)
     --pigskin   = football brown
     --turf-deep = darker green for hover/border
*/
:root{
  --bg:#080c10;--surface:#0d1117;--surface2:#131920;--surface3:#1a2330;
  --border:#1e2d3d;--border2:#253545;
  --gold:#f0a500;--gold2:#c47f00;
  --blue:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f97316;
  --turquoise:#06b6d4;--turquoise2:#0891b2;
  --text:#ffffff;--text2:#e2e8f0;--text3:#94a3b8;
  /* NFL sport tokens (replaces baseball's --title-blue / --title-red) */
  --turf:#16a34a;            /* field green — for "Watch" in the wordmark */
  --turf-deep:#15803d;       /* darker green — borders, hovers */
  --pigskin:#92400e;         /* football brown — for "101" in the wordmark */
  --pigskin-light:#b45309;   /* lighter brown for accents */
  --header-grad-1:#080c10;--header-grad-2:#0d1520;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Nunito Sans',sans-serif;
  font-size:14px;
  font-weight:700;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── HEADER ───────────────────────────────────────────────────────────────
   Mirrors baseball's header EXACTLY in structure — same .header,
   .logo-wrap, .logo, .logo-img, .logo-sub class names so the file feels
   like the same product family. Only the color CLASSES differ:
     - .logo-watch   → green (matches "Watch" in baseball's red, but NFL green)
     - .logo-football → brown (where baseball used .logo-baseball blue)
*/
.header{
  background:linear-gradient(135deg,var(--header-grad-1) 0%,var(--header-grad-2) 50%,var(--header-grad-1) 100%);
  border-bottom:1px solid var(--turf-deep);
  padding:1.25rem 1.5rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:100;
}
.logo-wrap{display:flex;align-items:baseline;gap:12px}
.logo{
  font-family:'Bowlby One',sans-serif;
  font-size:64px;
  letter-spacing:0.08em;
  line-height:1;
  display:flex;
  align-items:center;
  gap:0.05em;
}
.logo-img{height:1.8em;width:auto;display:block;flex-shrink:0}
.logo .logo-watch{color:var(--turf)}
.logo .logo-football{color:var(--pigskin-light)}
.logo-sub{
  font-family:'Nunito Sans',sans-serif;
  font-size:10px;
  letter-spacing:0.2em;
  color:var(--turf);
  text-transform:uppercase;
}
.header-right{display:flex;align-items:center;gap:14px}
.last-updated{
  font-family:'Nunito Sans',sans-serif;
  font-size:11px;
  color:var(--turf);
}

/* ── BUTTONS ────────────────────────────────────────────────────────────── */
.btn{
  padding:7px 14px;
  border-radius:6px;
  font-size:12px;
  font-family:'Nunito Sans',sans-serif;
  cursor:pointer;
  border:1px solid;
  transition:all 0.15s;
  letter-spacing:0.05em;
}
.btn-gold{background:var(--gold);color:#000;border-color:var(--gold);font-weight:500}
.btn-gold:hover{background:#fbbf24;border-color:#fbbf24}
.btn-outline{background:transparent;color:var(--text2);border-color:var(--border2)}
.btn-outline:hover{background:var(--surface2);color:var(--text);border-color:var(--text3)}

/* ── BODY LAYOUT ──────────────────────────────────────────────────────────
   Two side-by-side cards on desktop: Season State + Trending Adds.
   Stacks vertically on mobile via flex-wrap.
*/
.body-wrap{
  padding:1.5rem;
  display:flex;
  flex-wrap:wrap;
  gap:1.5rem;
  align-items:flex-start;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:1.25rem;
  flex:1;
  min-width:300px;
}
.card h2{
  font-family:'Nunito Sans',sans-serif;
  font-size:14px;
  font-weight:800;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--turf);
  margin-bottom:0.75rem;
  border-bottom:1px solid var(--border2);
  padding-bottom:0.5rem;
}
.kv{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  font-size:13px;
  border-bottom:1px solid var(--border);
}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;font-size:11px}
.kv .v{color:var(--text);font-weight:700}

/* ── TRENDING TABLE ──────────────────────────────────────────────────────── */
table.trending{width:100%;border-collapse:collapse;font-size:13px}
table.trending thead th{
  text-align:left;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.1em;
  color:var(--text3);
  font-weight:700;
  padding:6px 4px;
  border-bottom:1px solid var(--border2);
}
table.trending tbody td{
  padding:8px 4px;
  border-bottom:1px solid var(--border);
}
table.trending tbody tr:hover{background:var(--surface2)}
table.trending tbody td.rk{color:var(--text3);font-weight:800;width:30px}
table.trending tbody td.id{font-family:monospace;color:var(--turquoise)}
table.trending tbody td.cnt{text-align:right;color:var(--turf);font-weight:800}

/* ── STATUS BAR ─────────────────────────────────────────────────────────── */
.status-bar{
  font-size:11px;
  color:var(--text3);
  margin-top:0.75rem;
  font-style:italic;
}
.status-bar.error{color:var(--red);font-weight:700;font-style:normal}
.status-bar.ok{color:var(--turf)}

/* ── FOOTER ─────────────────────────────────────────────────────────────── */
.footer{
  text-align:center;
  padding:2rem 1rem;
  color:var(--text3);
  font-size:11px;
  border-top:1px solid var(--border);
  margin-top:2rem;
}
.footer a{color:var(--turf);text-decoration:none}
.footer a:hover{text-decoration:underline}
</style>
</head>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
// Single source of truth for the NFL backend. Same pattern as baseball.
const SERVER_URL = 'https://nfl-nas.fantasywatch101.com';

// Stamp the backend URL into the footer so the user can see it at a glance.
document.getElementById('backend-url').textContent = SERVER_URL;

// ── Helpers ──────────────────────────────────────────────────────────────────
function fmtSeasonType(t){
  switch(t){
    case 'off':     return 'Offseason';
    case 'pre':     return 'Preseason';
    case 'regular': return 'Regular Season';
    case 'post':    return 'Postseason';
    default:        return t || '—';
  }
}
function fmtNumber(n){
  if(n == null || n === '') return '—';
  return Number(n).toLocaleString();
}
function nowStamp(){
  const d = new Date();
  const pad = (x) => String(x).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// ── /sleeper/state ───────────────────────────────────────────────────────────
async function loadSeasonState(){
  const bodyEl   = document.getElementById('season-state-body');
  const statusEl = document.getElementById('season-state-status');
  statusEl.textContent = 'Fetching from server…';
  statusEl.className = 'status-bar';
  try{
    const res = await fetch(`${SERVER_URL}/sleeper/state`);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    bodyEl.innerHTML = `
      <div class="kv"><span class="k">Season</span><span class="v">${data.season || '—'}</span></div>
      <div class="kv"><span class="k">Type</span><span class="v">${fmtSeasonType(data.season_type)}</span></div>
      <div class="kv"><span class="k">Week</span><span class="v">${data.week ?? '—'}</span></div>
      <div class="kv"><span class="k">Display Week</span><span class="v">${data.display_week ?? '—'}</span></div>
      <div class="kv"><span class="k">Previous Season</span><span class="v">${data.previous_season || '—'}</span></div>
      <div class="kv"><span class="k">Season Has Scores</span><span class="v">${data.season_has_scores ? 'Yes' : 'No'}</span></div>
      <div class="kv"><span class="k">Season Start Date</span><span class="v">${data.season_start_date || 'TBD'}</span></div>
    `;
    statusEl.textContent = `OK — fetched ${nowStamp()}`;
    statusEl.className = 'status-bar ok';
    return true;
  }catch(e){
    bodyEl.innerHTML = '<div style="color:var(--text3);padding:1rem 0">Could not load season state.</div>';
    statusEl.textContent = `Error: ${e.message}`;
    statusEl.className = 'status-bar error';
    return false;
  }
}

// ── /sleeper/trending ────────────────────────────────────────────────────────
async function loadTrending(){
  const bodyEl   = document.getElementById('trending-body');
  const statusEl = document.getElementById('trending-status');
  statusEl.textContent = 'Fetching from server…';
  statusEl.className = 'status-bar';
  try{
    const res = await fetch(`${SERVER_URL}/sleeper/trending?limit=10&hours=24`);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const rows = (data.trending || []).map((t,i) => `
      <tr>
        <td class="rk">${i+1}</td>
        <td class="id">${t.player_id}</td>
        <td class="cnt">${fmtNumber(t.count)}</td>
      </tr>
    `).join('');
    bodyEl.innerHTML = rows || '<tr><td colspan="3" style="color:var(--text3);padding:1rem 0">No trending data.</td></tr>';
    statusEl.textContent = `OK — ${data.trending?.length || 0} players, lookback ${data.lookback_hours}h, fetched ${nowStamp()}`;
    statusEl.className = 'status-bar ok';
    return true;
  }catch(e){
    bodyEl.innerHTML = '<tr><td colspan="3" style="color:var(--text3);padding:1rem 0">Could not load trending adds.</td></tr>';
    statusEl.textContent = `Error: ${e.message}`;
    statusEl.className = 'status-bar error';
    return false;
  }
}

// ── Refresh All ──────────────────────────────────────────────────────────────
async function loadAll(){
  document.getElementById('last-updated').textContent = 'Refreshing…';
  const [stateOk, trendOk] = await Promise.all([loadSeasonState(), loadTrending()]);
  const stamp = nowStamp();
  if(stateOk && trendOk){
    document.getElementById('last-updated').textContent = `Updated ${stamp}`;
  }else{
    document.getElementById('last-updated').textContent = `Partial update ${stamp} — see status below`;
  }
}

// ── Boot ─────────────────────────────────────────────────────────────────────
loadAll();
</script>
